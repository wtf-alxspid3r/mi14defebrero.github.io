<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="1.JPG">
  <title>unclick+</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #FF70FA;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif; /* Tipografía Arial */
      color: #FFFFFF;
      cursor: pointer;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    .container {
      text-align: center;
      width: 100%;
      max-width: 500px;
      padding: 24px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 10;
    }

    /* Fotos en forma de corazón */
    img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      margin-bottom: 18px;
      transition: transform 0.6s ease, opacity 0.6s ease;
      position: relative;
      border-radius: 16px;
      clip-path: path('M10,30 
                        A20,20 0 0,1 50,30 
                        A20,20 0 0,1 90,30 
                        Q90,60 50,90 
                        Q10,60 10,30 Z');
    }

    h1 {
      font-size: 1.4rem;
      line-height: 1.4;
      margin: 0;
      transition: font-size 0.5s ease;
      position: relative;
      z-index: 10;
    }

    /* Animación fade */
    .fade { animation: fadeIn 0.6s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .heartbeat { animation: heartbeat 1s ease-in-out infinite; }
    @keyframes heartbeat { 0%,100% {transform:scale(1);} 50%{transform:scale(1.15);} }

    /* Botones */
    .buttons {
      margin-top: 20px;
      display: none;
      gap: 16px;
      justify-content: center;
      position: relative;
      z-index: 10;
    }

    .buttons button {
      padding: 12px 20px;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      cursor: pointer;
    }

    .accept { background: #ff4fd8; color: white; }
    .reject { background: #ffffff; color: #ff4fd8; }

    /* Patelitos de fresa */
    .patelito {
      position: fixed;
      top: -40px;
      font-size: 2rem;
      animation: fall linear forwards;
      z-index: 9999;
      pointer-events: none;
    }
    @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity:0; } }
  </style>
</head>

<body onclick="changeVibe()">
  <div class="container">
    <img id="vibeImage" src="FOTO-1..JPG" alt="vibe image" />
    <h1 id="phrase">HOLA AMOR! &lt;3</h1>

    <div class="buttons" id="finalButtons">
      <button class="accept" onclick="accept()">Acepto <3</button>
      <button class="reject" onclick="reject()">No acepto </3></button>
    </div>
  </div>

  <script>
    const phrases = [
      "Yo se que el 14 es una fecha importante para ti y ahora para mi.",
      "Es por eso que...",
      "hice este pequeño sitio",
      "para pedirte una pequeña cosa pero importante",
      "pero de una manera diferente, como me gusta hacer las cosas",
      "sin antes decirte lo mucho que me encantas y lo importante que eres para mi",
      "¿Quieres ser mi 14 de Febrero?"
    ];

    const images = [
      "FOTO-1..JPG",
      "FOTO-2..JPG",
      "FOTO-3..JPG",
      "FOTO-4..JPG",
      "FOTO-5..JPG",
      "FOTO-6..JPG",
      "FOTO-7..JPG"
    ];

    const phraseEl = document.getElementById("phrase");
    const imageEl = document.getElementById("vibeImage");
    const buttonsEl = document.getElementById("finalButtons");

    let phraseIndex = 0;
    let imageIndex = 0;
    let showing = "text";
    let finished = false;

    imageEl.style.display = "none";

    function applyFade(el) {
      el.classList.remove("fade");
      void el.offsetWidth;
      el.classList.add("fade");
    }

    function changeVibe() {
      if (finished) return;

      if (showing === "text") {
        phraseEl.style.display = "none";

        if (imageIndex < images.length) {
          imageEl.src = images[imageIndex++];
          imageEl.style.display = "block";
          applyFade(imageEl);
          showing = "image";
        }
      } else {
        imageEl.style.display = "none";

        if (phraseIndex < phrases.length) {
          phraseEl.textContent = phrases[phraseIndex++];
          phraseEl.style.display = "block";

          if (phraseIndex === phrases.length) {
            phraseEl.style.fontSize = "2rem";
            phraseEl.classList.add("heartbeat");

            buttonsEl.style.display = "flex";
            applyFade(buttonsEl);
          } else {
            phraseEl.style.fontSize = "1.4rem";
            phraseEl.classList.remove("heartbeat");
          }

          applyFade(phraseEl);
          showing = "text";

          if (phraseIndex === phrases.length) finished = true;
        }
      }
    }

    function lluviaDePatelitos() {
      for (let i = 0; i < 30; i++) {
        const p = document.createElement("div");
        p.className = "patelito";
        p.textContent = "🍓🍰";
        p.style.left = Math.random() * 100 + "vw";
        p.style.animationDuration = 2 + Math.random() * 2 + "s";
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 4000);
      }
    }

    function accept() {
      phraseEl.textContent = "Sabía que dirías que sí <3 Te amo muchisimo. ( ˶˘ ³˘)♡";
      phraseEl.style.fontSize = "1.8rem";
      phraseEl.classList.remove("heartbeat");
      buttonsEl.style.display = "none";
      applyFade(phraseEl);
      lluviaDePatelitos();
    }

    function reject() {
      phraseEl.textContent = "Inténtalo de nuevo o eres maldito. /ᐠ - ˕ -マ ";
      phraseEl.style.fontSize = "1.4rem";
      phraseEl.classList.remove("heartbeat");
      applyFade(phraseEl);
    }
  </script>
</body>
</html>
