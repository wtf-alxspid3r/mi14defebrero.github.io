<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <link rel="icon" type="image/png" href="1.JPG">
  <title>unclick+</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #FF70FA;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Tahoma";
      font-style: normal;
      color: #FFFFFF;
      cursor: pointer;
      padding: 20px;
    }

    .container {
      text-align: center;
      width: 100%;
      max-width: 500px;
      padding: 24px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 16px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 1.4rem;
      line-height: 1.4;
      margin: 0;
    }

    p {
      margin-top: 10px;
      opacity: 0.6;
      font-size: 0.8rem;
    }
  </style>
</head>

<body onclick="changeVibe()">
  <div class="container">
  <img id="vibeImage" src="FOTO-1..JPG" alt="vibe image" />
  <h1 id="phrase">HOLA AMOR! <3 </h1>
</div>


<script>
  const phrases = [
    "Yo se que el 14 es una fecha importante para ti y ahora para mi.",
    "Es por eso que...",
    "hice este pequeño sitio",
    "para pedirte una pequeña cosa pero importante",
    "pero de una manera diferente, como me gusta hacer las cosas",
    "sin antes decirte lo mucho que me encantas y lo importante que eres para mi",
    "¿Quieres ser mi 14 de Febrero?"
  ];

  const images = [
    "FOTO-1..JPG",
    "FOTO-2..JPG",
    "FOTO-3..JPG",
    "FOTO-4..JPG",
    "FOTO-5..JPG",
    "FOTO-6..JPG",
    "FOTO-7..JPG",
    "FOTO-8..JPG"
  ];

  const phraseEl = document.getElementById("phrase");
  const imageEl = document.getElementById("vibeImage");

  let phraseIndex = 0;
  let imageIndex = 0;
  let showing = "text";

  imageEl.style.display = "none";

  function changeVibe() {
    if (showing === "text") {
      // ocultar texto
      phraseEl.style.display = "none";

      // mostrar imagen en orden
      if (imageIndex < images.length) {
        imageEl.src = images[imageIndex];
        imageIndex++;
      }

      imageEl.style.display = "block";
      showing = "image";
    } else {
      // ocultar imagen
      imageEl.style.display = "none";

      // mostrar frase en orden
      if (phraseIndex < phrases.length) {
        phraseEl.textContent = phrases[phraseIndex];
        phraseIndex++;
      }

      phraseEl.style.display = "block";
      showing = "text";
    }
  }
</script>
